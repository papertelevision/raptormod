[autoexec]
@echo off
rem DOS/4GW prints its own banner (version + Rational Systems copyright) whenever a
rem protected-mode binary starts -- TM.EXE for the intro and then R.EXE. DOS4G=QUIET is
rem the extender's own documented switch for that; it is read by the stub, not by DOSBox,
rem so it must be set before AZRAEL.BAT runs either program.
SET DOS4G=QUIET
mount c .\GAME
imgmount d .\AZT.CUE -t cdrom
config -securemode
c:
cd AZRAEL
CLS
rem AztMod: the '1,2,1' notice and PAUSE6K's 'press any key or wait 6 seconds'
rem removed -- they sat between launch and the intro movie. AZW.COM is kept: it
rem prints nothing and does something, so it is not a message screen.
..\AZW.COM
cls
call AZRAEL.BAT
exit
