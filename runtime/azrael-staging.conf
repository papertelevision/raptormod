# Azrael's Tear -- DOSBox Staging 0.83 configuration (AztMod)
#
# Replaces azrael-base.conf + azrael-graphics.conf, which are DOSBox 0.74-3
# files. Staging renamed or dropped a lot of keys, so this is NOT a copy of
# those with edits -- only the settings that actually matter for this game are
# set, and everything else is left at Staging's defaults, which are saner than
# 0.74's.
#
# Gone from 0.74 and deliberately not carried over:
#   [render] scaler        removed in Staging; superseded by 'shader'
#   [sdl] fullresolution / windowresolution   replaced by fullscreen_mode / window_size
#   [sdl] autolock         moved to [mouse] mouse_capture
#   [sdl] usescancodes     removed
#   [sdl] priority         removed
#   [cpu] cycles           renamed; see cpu_cycles_protected below

[sdl]
output          = opengl
fullscreen      = on
fullscreen_mode = forced-borderless

# TEARING / JUDDER ON A HIGH-REFRESH DISPLAY.
#
# vsync was genuinely working -- the log said
#   DISPLAY: Presenting at 180 Hz host rate with vsync
# but the DOS mode runs at 70.007 Hz and 180/70.007 = 2.571, so every game frame
# was held for 3, 3, 2, 3, 3, 2... refreshes. That uneven cadence is judder, and
# during camera pans it reads exactly like tearing.
#
# On a VRR display the fix is to stop resampling entirely: present at the DOS
# mode's own rate and let the panel follow it. Staging's docs are explicit that
# 'dos-rate' is the best option on VRR monitors, and that vsync should be OFF
# there for perfect frame pacing and low input lag.
#
# If this makes tearing WORSE, the display is not actually in VRR mode -- put
# both lines back to 'host-rate' / 'on', or just run:
#   Play-Azrael-Staging.bat --set presentation_mode=host-rate --set vsync=on
# Tearing persisted with BOTH (host-rate + vsync on) and (dos-rate + vsync off).
# When both tear, the cause is below Staging: 'standard' fullscreen hands over to
# exclusive/independent-flip presentation, where the display driver can simply
# ignore the vsync request. Staging documents 'forced-borderless' for exactly
# this -- "if your graphics card driver decides to disable fullscreen
# optimisation on Windows, resulting in exclusive fullscreen".
#
# Borderless means the Desktop Window Manager composites the frame, and DWM is
# always vsynced, so tearing becomes structurally impossible. The documented cost
# is slightly worse frame pacing.
#
# Belt and braces for now: borderless AND vsync AND host-rate. If this kills the
# tearing we can relax it one step at a time -- dos-rate first, since that
# removes the 70 -> 180 Hz judder.
# vsync ON + presentation_mode=host-rate meant Staging presented (and BLOCKED on)
# every host refresh -- 180 Hz here -- while running the xbr-lv2-3d shader and
# dedithering over a fullscreen image. The emulation loop is interleaved with
# presentation, so when the GPU misses that 5.5 ms budget emulated time falls
# behind the WALL CLOCK by a roughly constant factor. The game stays internally
# consistent (its own clock is emulated) but audio plays in real time, so the
# music stretches. That is the "consistent slow motion, same in every room".
vsync             = off
presentation_mode = auto
[mouse]
# The mod makes mouselook the default, so the pointer has to be grabbed from the
# start -- 'onclick' (Staging's default) would leave you unable to look until you
# clicked, and the left button fires the weapon.
mouse_capture = onstart

[dosbox]
# Suppress DOSBox's own startup output -- the drive/MSCDEX lines that flash up before
# the game. An invalid value here is NOT fatal: DOSBox warns and falls back to 'high',
# so the worst case is that the messages simply come back.
startup_verbosity = quiet
machine  = svga_s3
# 800x600 makes every full-screen surface 480,000 bytes instead of 307,200, and
# the game holds several. 16 MB was enough at 640x480; at 1024x768 it exited
# after ~18 s and 32 MB held, so give hi-res the headroom.
# 32, not 64. DOSBox warns that sizes above 31 MB are not recommended for most
# DOS games, and DOS/4GW is one of the extenders that misbehaves with very large
# pools -- 64 MB exited after ~17 s. 32 MB is the value recorded as holding at
# 1024x768, and it still covers the bigger surfaces (786,432 bytes each, plus a
# 1,179,648-byte z-buffer).
memsize  = 32
# 'all' IS REQUIRED NOW. 1600x1200x8 is mode 0x120, which is a DOSBox extension
# rather than a standard VBE mode -- the VBE list stops at 1280x1024 -- so the
# trimmed 'compatible' set does not contain it and the game's mode scan would
# fail. (This comment used to say the game could not ask for any such mode.)
# 1600x1200x8 needs 1,920,000 bytes of video memory. The mode is offered at the
# default and at 2 MB too (BIOS-queried), so this is headroom rather than a
# requirement -- but 2 MB leaves only 177 KB spare, and 4 MB is what an S3
# Trio64 shipped with anyway.
vmemsize = 4
vesa_modes = all

# THE EMULATED MODE'S REFRESH RATE, RAISED TO THE MONITOR'S.
#
# DOSBox only reads the game's framebuffer once per EMULATED vertical refresh, and this
# mode's own rate is about 70 Hz. That was irrelevant at 22 fps. With the host renderer
# delivering 55-80+ fps into the framebuffer it became the ceiling on what reaches the
# screen: anything above ~70 was drawn and never shown. 'host' makes the emulated mode
# refresh at the monitor's rate (180 Hz here), so every delivered frame can be displayed.
# Staging warns that some games misbehave with a non-standard rate. This one takes its
# timing from the PIT, not from vertical retrace -- its loop already ran at 337 fps with
# the cap off -- but if anything looks wrong, delete this line. Backup: .pre-dosrate
dos_rate = host

[render]
# WHY NOT 'sharp'.
#
# sharp-bilinear is the right DEFAULT for DOS games, but on this display it is
# very nearly a no-op, and Staging's own log says why:
#
#   DISPLAY: VESA 640x480 256-colour graphics mode 101h ... scaled to 2133x1600
#
# 2133/640 = 1600/480 = 3.333x. 'sharp' integer-scales as far as it fits (3x) and
# bilinear-filters only the leftover 1.11x, so hardly any filtering happens. That
# is the entire point of sharp-bilinear -- it exists to stop pixels coming out
# uneven at non-integer scales, NOT to smooth artwork. Hence "can't tell a
# difference".
#
# Actually smoothing needs an EDGE-AWARE scaler. These are the same family as
# 0.74's hq2x / advmame, but written as GLSL and run on the GPU -- so unlike
# 0.74 they cost no CPU, which was the main argument against them before.
#
# 'xbr-lv2-3d' is the variant tuned for 3D-rendered content rather than hand-drawn
# sprite art: it reconstructs diagonals without aggressively redrawing texture
# detail, which is what a software-rasterised 3D game wants.
#
# Swap in any of these to compare (or pass one to Play-Azrael-Staging.bat):
#   sharp                sharp-bilinear, the near-no-op above
#   nearest              sharpest possible        (0.74's 'openglnb')
#   bilinear             plain blur               (0.74's 'output=opengl')
#   scaler/advinterp3x   gentler than xBR
#   scaler/xbr-lv3       strongest edge reconstruction
#   crt-auto             Staging's adaptive CRT emulation
shader          = sharp
aspect          = auto
integer_scaling = auto
viewport        = fit

# 1996 8-bit art fakes extra colours with checkerboard dithering -- and that
# dither is exactly what makes edge-aware scalers smear, because they read the
# checkerboard as detail worth reconstructing. Dedithering cleans the input
# first, so it improves the picture on its own AND makes the scaler behave.
#
# 0 = off, 100 = full strength. Staging documents this for CGA/EGA, but the
# checkerboard detector works on any paletted output.
dedithering     = 75

# 1996 colour, not CRT-emulated colour. Staging was auto-applying a P22 phosphor
# profile and a 7800K white point on top of the game's palette:
#
#   RENDER: Auto-switched to P22 CRT color profile
#   RENDER: Auto-switched to 7800K colour temperature
#
# 'off' makes every adjustment in this section inert -- crt_color_profile,
# color_temperature, brightness, contrast, gamma -- and the raw RGB values go
# straight to the display. (The sRGB colour-space transform always stays on;
# Staging cannot disable that.)
image_adjustments = off

[cpu]
core    = dynamic
cputype = auto
# The game is a DOS/4GW protected-mode binary, so cpu_cycles_protected is the one
# that applies -- cpu_cycles only covers real mode. 0.74 ran 'cycles=max limit
# 280000', i.e. as fast as possible but capped; a fixed 280000 gives the same
# ceiling and is steadier frame to frame.
# Was a fixed 280000, inherited from 0.74's 'cycles=max limit 280000'. This game
# is a SOFTWARE 3D rasteriser, so frame rate is directly proportional to how much
# emulated CPU work fits in a millisecond -- cycles ARE frame rate here. 280000
# was a 2000s-era ceiling; this host is a 16-core Ryzen AI MAX+ 395.
#
# 'max' lets Staging use as much as one core sustains. Staging warns to go back to
# a fixed value if you get audio drop-outs or the game runs too fast; a 1996 title
# is not guaranteed to be frame-rate independent. Fall back with e.g.
#   Play-Azrael-Staging.bat --set cpu_cycles_protected=500000
# SPEED AND FRAME RATE ARE THE SAME DIAL ON THIS GAME.
#
# It is frame-tied end to end: movement is 'pos += dir * constant' (a per-FRAME
# step, not per-second) at 0x1D747, and the whole animation system -- 0x20000 to
# 0x25000, ICharacterAnim / PlayCharacterAnimation / DecodeAnimationFrame --
# never reads a clock once. So cycles do not buy frame rate on top of a fixed
# game speed; they buy BOTH together.
#
# 'max' was noticeably faster and also made the characters run like cartoons.
# 400000 is a middle point to sweep from -- ~43% above the old 280000 ceiling.
# Nudge it with the launcher until the speed looks right:
#   Play-Azrael-Staging.bat --set cpu_cycles_protected=340000
#   Play-Azrael-Staging.bat --set cpu_cycles_protected=500000
# A FIXED cycle count does NOT guarantee real time. DOSBox runs N cycles per
# EMULATED millisecond; if the host cannot deliver N per REAL millisecond,
# emulated time falls behind the wall clock. Everything on the emulated clock
# (AztFrameLimit, animation) still looks consistent, but the sound card plays
# samples in real time -- so the music stretches into slow motion. That is
# exactly what 700000 did here.
#
# 'max' makes Staging auto-adjust cycles to KEEP emulated time == real time, so
# audio stays correct and the game simply drops frames when the host cannot keep
# up. Safe to leave uncapped because AztFrameLimit caps the game at 40 fps on the
# PIT regardless of how many cycles are available -- the surplus is burned in its
# spin, it cannot turn into speed.
cpu_cycles_protected = max
[sblaster]
sbtype = sb16
sbbase = 220
irq    = 7
dma    = 1
hdma   = 5

[midi]
mpu401 = intelligent
# The game's own music driver (GAME\AZRAEL\MDI.INI) is set to MPU401.MDI, i.e.
# General MIDI, instead of the SBPRO2.MDI OPL3 FM it shipped with. Proof it is
# General MIDI and not MT-32: the Miles TIMB chunk inside each .XMI lists the
# instruments, and CATHEDRL.XMI asks for 19 Church Organ / 52 Choir Aahs / 48-49
# Strings -- GM program numbers used semantically.
#
# 'fluidsynth' renders in-process. The alternative, 'port', routes to Windows'
# Microsoft GS Wavetable Synth: no extra files, but roughly 100 ms of latency and
# much weaker samples.
mididevice = fluidsynth

[fluidsynth]
# GeneralUser-GS, the bank AztMod ships. SGM-V2.01 (236 MB) was tried against it
# and the difference did not justify the size: A/B'd offline by rendering the
# same cue through both with AztMod\tools\FluidRender.cs. It is also the only one
# of the two whose licence permits redistribution, so a release has to use it
# regardless.
#
# WORTH KNOWING IF ANOTHER BANK IS EVER TRIED: soundfonts are not level-matched
# to each other. SGM rendered about 4 dB quieter than this one (peak 3563 / RMS
# 541 against 6513 / 874 on cathedrl.mid), and under this game's ambience a
# quieter bank reads as "no difference at all" rather than as a quieter one.
# Match levels with 'soundfont_volume' (a percentage, 1..800, music only) BEFORE
# judging a swap, or the comparison is not a comparison.
soundfont     = GeneralUser-GS.sf2
soundfont_dir = soundfonts

# A BIGGER ROOM, because of what this score actually is. The General MIDI
# arrangements MDI.INI selects are written for organ, choir, harp and strings:
# CATHEDRL asks for 19 Church Organ, 52 Choir Aahs and 48/49 String Ensemble,
# PEACEFUL for 46 Orchestral Harp, 48/49 Strings and 73 Flute. Those are
# instruments that live or die on their reverb tail, and Staging's 'auto' picks
# a general-purpose room for GeneralUser-GS -- 0.50 size, 0.30 damping, 0.80
# width, 0.70 level -- which is sensible for an average GM file and undersized
# for this one.
#
# Order is: room-size  damping  width  level. The lower damping matters as much
# as the bigger room: it keeps the high end alive in the tail instead of
# swallowing it, which is the difference between a choir in a stone building and
# one in a carpeted office.
#
# TASTE, NOT CORRECTNESS -- and it cannot fix the samples, only the space around
# them. KEPT DELIBERATELY after an A/B against 'auto'; this is not a leftover
# from the soundfont experiment, so do not "tidy" it back to default. To hear
# the stock room again without editing anything:
#   Play-Azrael-Modded.bat --set fsynth_reverb=auto
fsynth_reverb = 0.80 0.25 1.00 0.80

[dos]
xms = on
ems = on
umb = on

[voodoo]
# Azrael is a pure SOFTWARE renderer (RenderMorphics Reality Lab in ramp mode),
# so 3dfx emulation can never be used -- but Staging still starts it:
#   "VOODOO: Initialized with 4 MB of RAM, 16 threads, and bilinear filtering"
# That is 16 worker threads and 4 MB reserved for nothing. Off.
voodoo = off

[capture]
capture_dir = C:\Games\AzraelsTear-Modded\capture

